test_duration: 60
data_validation: |
  validate_partitions: false
  table_name: "scylla_bench.test"
  primary_key_column: "pk"
  max_partitions_in_test_table: 10
  partition_range_with_data_validation: 0-10

# NOTE: schema in latte gets created by a separate 'latte schema' command.
#       So, it's schema params must be defined in the 'latte_schema_parameters' SCT config option
#       and be supported by a rune script that is used.
latte_schema_parameters:
  keyspace: keyspace1_latte
  compaction_strategy: IncrementalCompactionStrategy
  column_count: 5
  replication_factor: 3

stress_cmd:
  # Blobs
  # - >-
  #   cql-stress-cassandra-stress write cl=QUORUM duration=1m
  #   -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3) compaction(strategy=IncrementalCompactionStrategy)'
  #   -mode cql3 native
  #   -rate threads=1000
  #   -pop seq=1..10000000
  # - >-
  #   cassandra-stress write cl=QUORUM duration=1m
  #   -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3) compaction(strategy=IncrementalCompactionStrategy)'
  #   -mode cql3 native
  #   -rate threads=1000
  #   -pop seq=1..10000000
  - >-
    latte run --function=write --consistency=QUORUM --duration=2500000 --tag main-01
    -P keyspace=\"keyspace1_latte\"
    --threads=3 --concurrency=128
    -P key_size=10 -P column_count=5 -P column_size=34
    -P row_count=10000000 -P offset=1
    data_dir/latte/latte_cs_alike.rn
  - >-
    latte run --function=write --consistency=QUORUM --duration=2500000 --tag main-02
    -P keyspace=\"keyspace1_latte\"
    --threads=3 --concurrency=128
    -P key_size=10 -P column_count=5 -P column_size=34
    -P row_count=10000000 -P offset=2500000
    data_dir/latte/latte_cs_alike.rn
  - >-
    latte run --function=write --consistency=QUORUM --duration=2500000 --tag main-03
    -P keyspace=\"keyspace1_latte\"
    --threads=3 --concurrency=128
    -P key_size=10 -P column_count=5 -P column_size=34
    -P row_count=10000000 -P offset=5000000
    data_dir/latte/latte_cs_alike.rn
  - >-
    latte run --function=write --consistency=QUORUM --duration=2500000
    -P keyspace=\"keyspace1_latte\"
    --threads=3 --concurrency=128
    -P key_size=10 -P column_count=5 -P column_size=34
    -P row_count=10000000 -P offset=7500000
    data_dir/latte/latte_cs_alike.rn
  # Counters
  # - >-
  #   cql-stress-cassandra-stress counter_write cl=QUORUM duration=1m
  #   -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3) compaction(strategy=IncrementalCompactionStrategy)'
  #   -mode cql3 native
  #   -rate threads=5
  #   -pop seq=1..10000000
  # - >-
  #   cassandra-stress counter_write cl=QUORUM duration=1m
  #   -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3) compaction(strategy=IncrementalCompactionStrategy)'
  #   -mode cql3 native
  #   -rate threads=5
  #   -pop seq=1..10000000
  # - >-
  #   latte run --function=counter_write --consistency=QUORUM --duration=10000000
  #   -P keyspace=\"keyspace1_latte\"
  #   --threads=3 --concurrency=128
  #   -P key_size=10 -P column_count=5
  #   -P row_count=10000000 -P offset=1
  #   data_dir/latte/latte_cs_alike.rn

prepare_write_cmd:
  - >-
    scylla-bench -workload=sequential -mode=write -replication-factor=3
    -partition-count=10 -clustering-row-count=100 -clustering-row-size=5120
    -concurrency=7 -rows-per-request=10 -max-rate=300
  - >-
    scylla-bench -workload=uniform    -mode=read  -replication-factor=3
    -partition-count=10 -clustering-row-count=100 -clustering-row-size=5120
    -concurrency=7 -rows-per-request=10 -max-rate=32000
    -duration=1m

n_loaders: 1
instance_type_db: 'i4i.large'
# testing the force iotune feature
force_run_iotune: true
n_db_nodes: 3

nemesis_class_name: NoOpMonkey
# nemesis_selector: "not disruptive"
nemesis_interval: 1

user_prefix: 'PR-provision-test'
instance_provision: 'spot'

use_preinstalled_scylla: true
